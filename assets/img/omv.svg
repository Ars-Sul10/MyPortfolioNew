<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100">
  <defs>
    <linearGradient id="omvGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="50%" stop-color="#1e3a8a"/>
      <stop offset="100%" stop-color="#2563eb"/>
    </linearGradient>
    <linearGradient id="starGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#ffffff"/>
    </linearGradient>
  </defs>
  <!-- Background Rounded Rect -->
  <rect width="100" height="100" rx="22" fill="url(#omvGrad)"/>
  
  <!-- Orion Constellation Constellation Nodes -->
  <circle cx="50" cy="22" r="3.5" fill="#38bdf8" filter="drop-shadow(0 0 3px #38bdf8)"/>
  <circle cx="32" cy="38" r="3.5" fill="#60a5fa"/>
  <circle cx="68" cy="38" r="3.5" fill="#60a5fa"/>
  
  <!-- Orion's Belt (3 Stars) -->
  <circle cx="42" cy="50" r="3" fill="#ffffff"/>
  <circle cx="50" cy="50" r="3" fill="#ffffff"/>
  <circle cx="58" cy="50" r="3" fill="#ffffff"/>
  
  <!-- Connecting Constellation Lines -->
  <line x1="50" y1="22" x2="32" y2="38" stroke="#38bdf8" stroke-width="1.5" stroke-opacity="0.6"/>
  <line x1="50" y1="22" x2="68" y2="38" stroke="#38bdf8" stroke-width="1.5" stroke-opacity="0.6"/>
  <line x1="32" y1="38" x2="42" y2="50" stroke="#60a5fa" stroke-width="1.5" stroke-opacity="0.6"/>
  <line x1="68" y1="38" x2="58" y2="50" stroke="#60a5fa" stroke-width="1.5" stroke-opacity="0.6"/>
  <line x1="42" y1="50" x2="58" y2="50" stroke="#ffffff" stroke-width="1.5" stroke-opacity="0.8"/>
  <line x1="42" y1="50" x2="35" y2="66" stroke="#60a5fa" stroke-width="1.5" stroke-opacity="0.6"/>
  <line x1="58" y1="50" x2="65" y2="66" stroke="#60a5fa" stroke-width="1.5" stroke-opacity="0.6"/>
  
  <circle cx="35" cy="66" r="3.5" fill="#38bdf8"/>
  <circle cx="65" cy="66" r="3.5" fill="#38bdf8"/>
  
  <!-- Wordmark -->
  <text x="50" y="86" text-anchor="middle" font-family="'Outfit', 'Plus Jakarta Sans', sans-serif" font-weight="800" font-size="12" fill="#ffffff" letter-spacing="2">ORION</text>
</svg>

